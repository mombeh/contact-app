---
  name: Lint Code Base
  
  on:
    push:
      branches-ignore: [master, main]
    pull_request:
      branches: [master, main]
  
  jobs:
    build:
      name: Lint Code Base
      runs-on: ubuntu-latest
  
      steps:
        - name: Checkout Code
          uses: actions/checkout@v2
          with:
            fetch-depth: 0
  
        - name: Lint Code Base
          uses: super-linter/super-linter@v6
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
            VALIDATE_ALL_CODEBASE: false
            DEFAULT_BRANCH: main
  
            # Only enable the linters you want
            VALIDATE_JAVASCRIPT_ES: true
            VALIDATE_JSX: true

            DISABLE_LINTERS: css
  
            # Remove ALL "VALIDATE_* = false" entries!
            
            # ESLint config
            ESLINT_CONFIG_FILE: eslint.config.js
  